# Muestra los últimos registros del webhook de Stripe y de la IA (para diagnosticar).
# GitHub → Actions → «Ver registros de Firebase» → Run workflow.
name: Ver registros de Firebase

on:
  workflow_dispatch:

jobs:
  registros:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Registros de stripeWebhook e ia (últimas 3 horas)
        run: |
          for SVC in stripewebhook ia; do
            echo "=================== $SVC ==================="
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SVC\" AND timestamp>=\"$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)\"" \
              --project cadencia-11cb6 --limit 40 --order desc \
              --format='value(timestamp,severity,httpRequest.status,httpRequest.requestMethod,textPayload)' || echo "(no se pudo leer)"
          done
