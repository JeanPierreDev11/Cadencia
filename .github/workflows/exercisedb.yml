# Descarga datos y GIF de ExerciseDB (RapidAPI) usando el secreto RAPIDAPI_KEY.
# Se lanza solo al cambiar herramientas/exercisedb/orden.json en la rama ejercicios-exercisedb
# (o a mano desde Actions si el flujo ya está en main). Guarda los resultados en esa misma rama.
name: Descargar ejercicios de ExerciseDB

on:
  push:
    branches: [ejercicios-exercisedb]
    paths: ['herramientas/exercisedb/orden.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exercisedb
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node herramientas/exercisedb/descargar.mjs

      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add herramientas/exercisedb public/ejercicios/db
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "ExerciseDB: datos descargados [skip ci]"
          git push
