# Publica la función de IA (functions/) y las reglas de Firestore en Firebase.
# Se lanza sola al cambiar functions/, firestore.rules o firebase.json, o a mano desde
# GitHub → Actions → «Publicar IA en Firebase» → Run workflow.
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  el contenido del archivo JSON de la cuenta de servicio   (obligatorio)
#   ANTHROPIC_API_KEY         la clave de la API de Claude                             (obligatorio)
#   STRIPE_SECRET_KEY         la clave de la API de Stripe (rk_… o sk_…)               (para cobrar Pro)
#   STRIPE_WEBHOOK_SECRET     el secreto de firma del webhook de Stripe (whsec_…)      (para cobrar Pro)
#   STRAVA_CLIENT_ID          el «Client ID» de la aplicación de Strava                (para conectar Strava)
#   STRAVA_CLIENT_SECRET      el «Client Secret» de la aplicación de Strava            (para conectar Strava)
#   DISCORD_FEEDBACK_WEBHOOK_URL  la URL del webhook del canal privado de Discord       (para recibir el feedback de la beta, (65))
# Si aún no has creado los de Stripe, Strava o Discord se guarda el valor «pendiente» y esa parte avisa de que no está configurada.
name: Publicar IA en Firebase

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'storage.rules', 'firebase.json', '.github/workflows/desplegar-ia.yml']
  workflow_dispatch:
    inputs:
      actualizar_clave:
        description: 'Volver a guardar las claves (Claude y Stripe) aunque ya estuvieran guardadas'
        type: boolean
        default: false

concurrency:
  group: desplegar-ia
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar secretos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          if [ -z "$KEY" ]; then echo "::error::Falta el secreto ANTHROPIC_API_KEY"; exit 1; fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar dependencias de la función
        run: npm ci --prefix functions

      - name: Guardar las claves como secretos de Firebase
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          DISCORD_FEEDBACK_WEBHOOK_URL: ${{ secrets.DISCORD_FEEDBACK_WEBHOOK_URL }}
          FORZAR: ${{ github.event.inputs.actualizar_clave }}
        run: |
          FB="npx --yes firebase-tools@15.34.0"
          for NAME in ANTHROPIC_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET DISCORD_FEEDBACK_WEBHOOK_URL; do
            VAL="${!NAME}"
            if CUR=$($FB functions:secrets:access $NAME --project cadencia-11cb6 2>/dev/null); then EXISTE=1; else EXISTE=0; CUR=""; fi
            if [ -n "$VAL" ]; then
              if [ "$FORZAR" = "true" ] || [ "$EXISTE" = "0" ] || [ "$CUR" = "pendiente" ]; then
                printf '%s' "$VAL" | $FB functions:secrets:set $NAME --data-file=- --force --project cadencia-11cb6
              else
                echo "$NAME ya estaba guardada."
              fi
            elif [ "$EXISTE" = "0" ]; then
              echo "$NAME no está en GitHub: se guarda «pendiente» hasta que la añadas."
              printf '%s' "pendiente" | $FB functions:secrets:set $NAME --data-file=- --force --project cadencia-11cb6
            fi
          done

      - uses: google-github-actions/setup-gcloud@v2

      - name: Dar a las funciones permiso para leer GEMINI_API_KEY
        # Si la clave se borra y se vuelve a crear en Secret Manager, el permiso se pierde y el despliegue de «coach» falla.
        run: |
          N=$(gcloud projects describe cadencia-11cb6 --format='value(projectNumber)')
          gcloud secrets add-iam-policy-binding GEMINI_API_KEY --project cadencia-11cb6 \
            --member="serviceAccount:${N}-compute@developer.gserviceaccount.com" --role=roles/secretmanager.secretAccessor --condition=None >/dev/null \
            && echo "Permiso de lectura de GEMINI_API_KEY OK" || echo "::warning::No se pudo dar permiso sobre GEMINI_API_KEY"

      - name: Publicar función y reglas
        run: npx --yes firebase-tools@15.34.0 deploy --only functions,firestore:rules --project cadencia-11cb6 --force --non-interactive

      # Reglas de la foto de perfil. Va aparte: si Firebase Storage aún no está activado en la consola, solo falla este paso.
      - name: Publicar reglas de Storage (foto de perfil)
        continue-on-error: true
        run: npx --yes firebase-tools@15.34.0 deploy --only storage --project cadencia-11cb6 --force --non-interactive
