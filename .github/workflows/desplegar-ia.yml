# Publica la función de IA (functions/) y las reglas de Firestore en Firebase.
# Se lanza sola al cambiar functions/, firestore.rules o firebase.json, o a mano desde
# GitHub → Actions → «Publicar IA en Firebase» → Run workflow.
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  el contenido del archivo JSON de la cuenta de servicio
#   ANTHROPIC_API_KEY         la clave de la API de Claude
name: Publicar IA en Firebase

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', '.github/workflows/desplegar-ia.yml']
  workflow_dispatch:
    inputs:
      actualizar_clave:
        description: 'Volver a guardar la clave de la API de Claude (si la has cambiado)'
        type: boolean
        default: false

concurrency:
  group: desplegar-ia
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar secretos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          if [ -z "$KEY" ]; then echo "::error::Falta el secreto ANTHROPIC_API_KEY"; exit 1; fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar dependencias de la función
        run: npm ci --prefix functions

      - name: Guardar la clave de la API de Claude como secreto de Firebase
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORZAR: ${{ github.event.inputs.actualizar_clave }}
        run: |
          if [ "$FORZAR" = "true" ] || ! npx --yes firebase-tools@15.34.0 functions:secrets:access ANTHROPIC_API_KEY --project cadencia-11cb6 >/dev/null 2>&1; then
            printf '%s' "$KEY" | npx --yes firebase-tools@15.34.0 functions:secrets:set ANTHROPIC_API_KEY --data-file=- --force --project cadencia-11cb6
          else
            echo "La clave ya estaba guardada."
          fi

      - name: Publicar función y reglas
        run: npx --yes firebase-tools@15.34.0 deploy --only functions,firestore:rules --project cadencia-11cb6 --force --non-interactive
