  <script>
    // Direcciones antiguas (GitHub Pages y *.web.app / *.firebaseapp.com): borra el service worker viejo y manda al dominio principal.
    var h = location.hostname;
    if (h.endsWith('github.io') || h === 'cadencia-11cb6.web.app' || h === 'cadencia-11cb6.firebaseapp.com') {
      var nueva = 'https://cadenciafit.app' + (h.endsWith('github.io') ? '/' : location.pathname) + location.search + location.hash;
      var ir = function () { location.replace(nueva); };
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }).then(ir, ir);
          setTimeout(ir, 1500);
        } else ir();
      } catch (e) { ir(); }
    }
  </script>

  <script>
    // Si tras 12 s sigue la pantalla de arranque (p. ej. una copia vieja de esta página apuntando a archivos que ya no existen), se borra la caché y el service worker y se recarga UNA vez.
    setTimeout(function () {
      var viejo = false; try { viejo = !!sessionStorage.getItem('cadencia-curar'); } catch (e) { /* nada */ }
      if (!document.getElementById('boot') || viejo) return;
      try { sessionStorage.setItem('cadencia-curar', '1'); } catch (e) { /* nada */ }
      var ir = function () { location.replace(location.pathname + '?r=' + Date.now()); };
      var rs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (l) { return Promise.all(l.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
      rs.then(function () { return window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : 0; }).then(ir, ir);
    }, 12000);
  </script>
